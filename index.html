<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Links</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- Container Principal -->
  <main class="w-full max-w-md flex flex-col items-center pt-8 pb-12">
    
    <!-- Header / Perfil -->
    <header class="flex flex-col items-center text-center mb-8">
      <!-- Foto de Perfil -->
      <div class="relative mb-4">
        <img 
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop" 
          alt="Foto de Perfil" 
          class="w-24 h-24 rounded-full object-cover border-2 border-emerald-400/80 p-1 shadow-xl"
        />
      </div>
      
      <!-- Nome / @ -->
      <h1 class="text-xl font-bold tracking-tight text-white mb-1">
        Seu Nome ou Marca
      </h1>
      <p class="text-xs uppercase tracking-widest text-emerald-400 font-semibold mb-2">
        @seuusuario
      </p>

      <!-- Biografia Curta -->
      <p class="text-sm text-slate-400 max-w-xs px-2">
        Confira abaixo meus produtos, cupons de desconto e links recomendados!
      </p>
    </header>

    <!-- Lista de Links / Produtos -->
    <section class="w-full space-y-3.5">

      <!-- Produto 1 -->
      <a 
        href="https://b4.app/QNOFobtP" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="group relative flex items-center justify-between w-full p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/60 hover:border-emerald-500/50 rounded-xl transition-all duration-200 shadow-md hover:shadow-emerald-500/10 hover:-translate-y-0.5"
      >
        <div class="flex items-center space-x-3">
          <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-slate-900 transition-colors">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          </div>
          <span class="font-medium text-slate-200 group-hover:text-white transition-colors">
            Produto Recomendado 1
          </span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-emerald-400 transition-colors"></i>
      </a>

      <!-- Produto 2 -->
      <a 
        href="https://b4.app/i4Ee9kZL" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="group relative flex items-center justify-between w-full p-4 bg-slate-800/80 hover:bg-slate-700/90 border border-slate-700/60 hover:border-emerald-500/50 rounded-xl transition-all duration-200 shadow-md hover:shadow-emerald-500/10 hover:-translate-y-0.5"
      >
        <div class="flex items-center space-x-3">
          <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-slate-900 transition-colors">
            <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          </div>
          <span class="font-medium text-slate-200 group-hover:text-white transition-colors">
            Produto Recomendado 2
          </span>
        </div>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-emerald-400 transition-colors"></i>
      </a>

    </section>

    <!-- Redes Sociais / Rodapé -->
    <footer class="mt-10 flex flex-col items-center space-y-4">
      <div class="flex items-center space-x-4">
        <a href="#" target="_blank" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors" title="Instagram">
          <i data-lucide="instagram" class="w-5 h-5"></i>
        </a>
        <a href="#" target="_blank" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors" title="TikTok">
          <i data-lucide="video" class="w-5 h-5"></i>
        </a>
        <a href="#" target="_blank" class="p-2 text-slate-400 hover:text-emerald-400 transition-colors" title="WhatsApp">
          <i data-lucide="message-circle" class="w-5 h-5"></i>
        </a>
      </div>
      
      <p class="text-xs text-slate-500">
        &copy; 2026 Todos os direitos reservados.
      </p>
    </footer>

  </main>

  <!-- Script para inicializar os ícones Lucide -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
