<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidados da Maju | Links & Recomendações</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 selection:bg-rose-500 selection:text-white">

  <!-- Container Principal -->
  <main class="w-full max-w-md flex flex-col items-center pt-6 pb-12">

    <!-- Perfil -->
    <header class="flex flex-col items-center text-center mb-8 w-full">
      <div class="relative mb-3">
        <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-amber-400 blur opacity-75 animate-pulse"></div>
        <img id="profile-avatar" src="" alt="Avatar Maju" class="relative w-24 h-24 rounded-full object-cover border-2 border-slate-900 shadow-2xl">
      </div>

      <h1 id="profile-name" class="text-2xl font-bold tracking-tight text-white mb-0.5"></h1>
      <p id="profile-username" class="text-xs uppercase tracking-widest text-rose-400 font-semibold mb-3"></p>
      
      <p id="profile-bio" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line max-w-xs bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 shadow-inner"></p>
    </header>

    <!-- Cards de Produtos -->
    <section id="products-list" class="w-full space-y-5">
      <!-- Inserido dinamicamente via data.js -->
    </section>

    <!-- Rodapé & Redes -->
    <footer class="mt-12 flex flex-col items-center space-y-4">
      <div id="socials-list" class="flex items-center space-x-3">
        <!-- Inserido dinamicamente via data.js -->
      </div>
      <p class="text-xs text-slate-600 font-medium">&copy; 2026 Cuidados da Maju. Todos os direitos reservados.</p>
    </footer>

  </main>

  <!-- Importa o arquivo com seus dados -->
  <script src="data.js"></script>

  <!-- Script de Renderização -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Renderiza Perfil
      document.getElementById("profile-avatar").src = profileData.avatar;
      document.getElementById("profile-name").textContent = profileData.name;
      document.getElementById("profile-username").textContent = profileData.username;
      document.getElementById("profile-bio").textContent = profileData.bio;

      // 2. Renderiza Produtos
      const container = document.getElementById("products-list");
      container.innerHTML = profileData.products.map(p => `
        <article class="bg-slate-900/90 border border-slate-800/80 hover:border-slate-700/80 rounded-2xl overflow-hidden shadow-xl transition-all duration-300">
          <div class="relative h-44 w-full bg-slate-800 overflow-hidden">
            <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-500">
            <span class="absolute top-3 right-3 bg-rose-500/90 backdrop-blur-md text-white text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-full shadow-md">
              ${p.badge}
            </span>
          </div>

          <div class="p-4">
            <h2 class="text-lg font-bold text-white mb-1">${p.title}</h2>
            <p class="text-xs text-slate-400 mb-4 leading-relaxed">${p.description}</p>

            <div class="space-y-2">
              <a href="${p.buyUrl}" target="_blank" rel="noopener noreferrer" 
                 class="flex items-center justify-center space-x-2 w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/10 active:scale-[0.98]">
                <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                <span>${p.buyText}</span>
              </a>

              <a href="${p.infoUrl}" target="_blank" rel="noopener noreferrer" 
                 class="flex items-center justify-center space-x-1.5 w-full py-2.5 px-4 bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white font-medium text-xs rounded-xl transition-colors border border-slate-700/50">
                <i data-lucide="info" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>${p.infoText}</span>
              </a>
            </div>
          </div>
        </article>
      `).join("");

      // 3. Renderiza Redes Sociais
      const socialsContainer = document.getElementById("socials-list");
      socialsContainer.innerHTML = profileData.socials.map(s => `
        <a href="${s.url}" target="_blank" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-400 hover:text-rose-400 hover:border-slate-700 transition-all">
          <i data-lucide="${s.icon}" class="w-5 h-5"></i>
        </a>
      `).join("");

      // 4. Ativa Ícones
      lucide.createIcons();
    });
  </script>
</body>
</html>
